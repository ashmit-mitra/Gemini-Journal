<!DOCTYPE html>
<html>
<head>
  <title>Gemini Journal</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    #chat-log { border: 1px solid #ccc; padding: 15px; height: 300px; overflow-y: auto; margin-bottom: 10px; }
    .user-msg { color: #2255aa; margin: 8px 0; }
    .ai-msg { color: #333; margin: 8px 0; background: #f5f5f5; padding: 8px; border-radius: 6px; }
    input, button { padding: 8px; margin: 4px 0; }
    #entry-input { width: 70%; }
  </style>
</head>
<body>
  <h1>Gemini Journal</h1>

  <div id="signed-out">
    <h3>Sign Up</h3>
    <input type="email" id="signup-email" placeholder="Email">
    <input type="password" id="signup-password" placeholder="Password">
    <button onclick="signUp()">Sign Up</button>

    <h3>Log In</h3>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="logIn()">Log In</button>
  </div>

  <div id="signed-in" style="display:none;">
    <p>Welcome, <span id="user-email"></span>! <button onclick="logOut()">Log Out</button></p>
<div style="margin: 15px 0;">
  <button onclick="getInsights()">✨ Get Reflection Insights</button>
  <div id="insights-panel" style="display:none; background:#eef7ff; padding:12px; border-radius:6px; margin-top:10px;"></div>
</div>
    <div id="chat-log"></div>
    <input type="text" id="entry-input" placeholder="Write your journal entry or thought...">
    <button onclick="sendEntry()">Send</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAbavgoR35l3OxvzXMAYkh02onvK-ErJoc",
      authDomain: "gemini-journal-ai-1a8c1.firebaseapp.com",
      projectId: "gemini-journal-ai-1a8c1",
      storageBucket: "gemini-journal-ai-1a8c1.firebasestorage.app",
      messagingSenderId: "569758845707",
      appId: "1:569758845707:web:44951a6ce88cef632eb00e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function signUp() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .catch(error => alert(error.message));
    }

    function logIn() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      auth.signInWithEmailAndPassword(email, password)
        .catch(error => alert(error.message));
    }

    function logOut() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('signed-out').style.display = 'none';
        document.getElementById('signed-in').style.display = 'block';
        document.getElementById('user-email').textContent = user.email;
      } else {
        document.getElementById('signed-out').style.display = 'block';
        document.getElementById('signed-in').style.display = 'none';
      }
    });

    async function sendEntry() {
      const input = document.getElementById('entry-input');
      const message = input.value;
      if (!message) return;

      const chatLog = document.getElementById('chat-log');
      chatLog.innerHTML += `<div class="user-msg"><b>You:</b> ${message}</div>`;
      input.value = '';

      try {
        const user = auth.currentUser;
        const idToken = await user.getIdToken();

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + idToken
          },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        if (data.reply) {
          const moodEmojis = {
            happy: '😊', sad: '😢', anxious: '😰', angry: '😠',
            excited: '🤩', calm: '😌', neutral: '😐', grateful: '🙏',
            tired: '😴', hopeful: '🌱'
          };
          const emoji = moodEmojis[data.mood] || '';
          chatLog.innerHTML += `<div class="ai-msg"><b>Gemini:</b> ${data.reply} <span title="${data.mood}">${emoji}</span></div>`;
        } else {
          chatLog.innerHTML += `<div class="ai-msg" style="color:red;">Error: ${data.error}</div>`;
        }
      } catch (err) {
        chatLog.innerHTML += `<div class="ai-msg" style="color:red;">Error: ${err.message}</div>`;
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function getInsights() {
      const panel = document.getElementById('insights-panel');
      panel.style.display = 'block';
      panel.innerHTML = 'Thinking...';

      try {
        const user = auth.currentUser;
        const idToken = await user.getIdToken();

        const response = await fetch('/api/insights', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + idToken
          }
        });

        const data = await response.json();
        if (data.insight) {
          panel.innerHTML = '<b>Your Reflection:</b><br>' + data.insight;
        } else {
          panel.innerHTML = 'Error: ' + data.error;
        }
      } catch (err) {
        panel.innerHTML = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
