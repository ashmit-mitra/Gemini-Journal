<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
  :root {
    --ink: #0a0a0f;
    --panel: #161622;
    --panel-line: #2b2a3a;
    --gold: #cf9f45;
    --gold-soft: #e9c98a;
    --text-main: #eae7dd;
    --text-muted: #9a9dc4;
    --text-dark: #2a2620;
    --text-dark-muted: #6b6355;
    --danger: #b5654f;
    --bg-glow-1: #16213e;
    --bg-glow-2: #0f1729;
    --border-soft: rgba(154, 157, 196, 0.25);
    --border-soft-2: rgba(154, 157, 196, 0.3);
    --hover-tint: rgba(207,159,69,0.1);
    --field-bg: rgba(255,255,255,0.04);
    --composer-bg: #15151e;
    --composer-text: #eae7dd;
    --composer-placeholder: #8a8a95;
    --surface: #14141d;
    --surface-line: #262635;
    --surface-text: #eae7dd;
    --surface-text-muted: #9a9dc4;

    /* Futuristic Edge Reflection Tokens (Dark Mode) */
    --glow-border: rgba(207, 159, 69, 0.35);
    --glow-edge-highlight: inset 0 1px 1px 0 rgba(255, 255, 255, 0.2), inset 0 -1px 1px 0 rgba(0, 229, 255, 0.15);
    --glow-box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(207, 159, 69, 0.18), 0 0 1px 1px rgba(0, 229, 255, 0.2);
    --glow-hover-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), 0 0 25px rgba(207, 159, 69, 0.35), 0 0 2px 1px rgba(0, 229, 255, 0.4);
  }

  [data-theme="light"] {
    --ink: #f5f3ec;
    --panel: #ffffff;
    --panel-line: #e4dcce;
    --gold: #b8823a;
    --gold-soft: #8f651f;
    --text-main: #2b2723;
    --text-muted: #6e675b;
    --text-dark: #2a2620;
    --text-dark-muted: #6b6355;
    --danger: #a1543f;
    --bg-glow-1: #e7dfcf;
    --bg-glow-2: #f2ebe0;
    --border-soft: rgba(122, 113, 92, 0.25);
    --border-soft-2: rgba(122, 113, 92, 0.3);
    --hover-tint: rgba(184,130,58,0.12);
    --field-bg: rgba(255, 255, 255, 0.6);
    --composer-bg: #ffffff;
    --composer-text: var(--text-dark);
    --composer-placeholder: var(--text-dark-muted);
    --surface: #ffffff;
    --surface-line: var(--panel-line);
    --surface-text: var(--text-dark);
    --surface-text-muted: var(--text-dark-muted);

    /* Futuristic Edge Reflection Tokens (Light Mode) */
    --glow-border: rgba(184, 130, 58, 0.45);
    --glow-edge-highlight: inset 0 1px 2px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 2px 0 rgba(184, 130, 58, 0.2);
    --glow-box-shadow: 0 10px 28px rgba(184, 130, 58, 0.08), 0 0 20px rgba(184, 130, 58, 0.12), 0 0 1px 1px rgba(184, 130, 58, 0.35);
    --glow-hover-shadow: 0 14px 34px rgba(184, 130, 58, 0.16), 0 0 26px rgba(184, 130, 58, 0.25), 0 0 2px 1px rgba(184, 130, 58, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% -10%, var(--bg-glow-1) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 10%, var(--bg-glow-2) 0%, transparent 50%),
      var(--ink);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .page {
    width: 100%;
    max-width: 640px;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
    gap: 12px;
  }

  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 2.1rem;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .masthead .eyebrow {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 6px;
  }

  .user-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.88rem;
    color: var(--text-muted);
  }

  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--hover-tint);
    border: 1px solid rgba(207,159,69,0.35);
    color: var(--gold-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 20px;
  }

  .btn-theme {
    width: 38px;
    height: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    border-radius: 50%;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 7px;
    border: 1px solid var(--border-soft-2);
    background: var(--field-bg);
    color: var(--text-main);
    padding: 9px 16px;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { border-color: var(--gold-soft); background: var(--hover-tint); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .btn-primary {
    background: var(--gold);
    color: #1b1710;
    border: none;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--gold-soft); }

  .btn-link {
    background: none;
    border: none;
    padding: 0;
    color: var(--gold-soft);
    font-size: 0.82rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .btn-link:hover { color: var(--gold); background: none; }

  .btn-ghost-danger { color: var(--danger); border-color: rgba(181,101,79,0.35); }
  .btn-ghost-danger:hover { background: rgba(181,101,79,0.12); border-color: var(--danger); }

  .btn-mic {
    width: 42px;
    padding: 9px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .btn-mic.recording {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(181,101,79,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(181,101,79,0); }
    100% { box-shadow: 0 0 0 0 rgba(181,101,79,0); }
  }

  .speak-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-dark-muted);
    font-size: 0.85rem;
    padding: 0;
    margin-left: 2px;
    vertical-align: middle;
    cursor: pointer;
  }
  .speak-btn:hover { background: rgba(0,0,0,0.08); color: var(--text-dark); }
  .speak-btn.speaking { color: var(--gold); }

  input[type="email"], input[type="password"], input[type="text"], textarea {
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    padding: 10px 12px;
    border-radius: 7px;
    border: 1px solid var(--border-soft-2);
    background: var(--field-bg);
    color: var(--text-main);
    width: 100%;
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted); }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  /* Futuristic Reflected Cards */
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--glow-border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: var(--glow-edge-highlight), var(--glow-box-shadow);
    backdrop-filter: blur(8px);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .auth-card:hover {
    box-shadow: var(--glow-edge-highlight), var(--glow-hover-shadow);
  }
  .auth-card h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.15rem;
    margin: 0 0 12px;
  }
  .auth-card + .auth-card { margin-top: 18px; }
  .field-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }

  .action-row { display: flex; gap: 10px; margin: 22px 0 16px; flex-wrap: wrap; }

  /* Panels with Edge Highlights */
  .panel {
    background: var(--surface);
    color: var(--surface-text);
    border: 1px solid var(--glow-border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
    position: relative;
    box-shadow: var(--glow-edge-highlight), var(--glow-box-shadow);
    backdrop-filter: blur(8px);
    transition: box-shadow 0.2s ease;
  }
  .panel:hover {
    box-shadow: var(--glow-edge-highlight), var(--glow-hover-shadow);
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
    background: var(--gold);
    border-radius: 12px 0 0 12px;
  }
  .panel b { font-family: 'Fraunces', serif; font-weight: 600; }

  /* Reflective Chat Log */
  #chat-log {
    background: var(--surface);
    border: 1px solid var(--glow-border);
    border-radius: 14px;
    padding: 22px 24px;
    height: 320px;
    overflow-y: auto;
    margin-bottom: 14px;
    box-shadow: var(--glow-edge-highlight), var(--glow-box-shadow);
    backdrop-filter: blur(8px);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 34px,
      var(--surface-line) 35px
    );
    transition: box-shadow 0.2s ease;
  }
  .user-msg, .ai-msg {
    color: var(--surface-text);
    margin: 0 0 12px;
    line-height: 35px;
  }
  .user-msg b { color: #4a4530; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; }
  .ai-msg b { color: var(--gold); font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; }
  .mood-seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--gold-soft);
    font-size: 0.85rem;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* Floating Bottom Glow Composer */
  .composer {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--composer-bg);
    border: 1px solid var(--glow-border);
    border-radius: 999px;
    padding: 8px 8px 8px 22px;
    box-shadow: var(--glow-edge-highlight), var(--glow-box-shadow);
    backdrop-filter: blur(12px);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .composer:focus-within {
    border-color: var(--gold);
    box-shadow: var(--glow-edge-highlight), var(--glow-hover-shadow);
  }
  .composer input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--composer-text);
    padding: 8px 4px;
  }
  .composer input::placeholder { color: var(--composer-placeholder); }
  .composer input:focus-visible { outline: none; }
  .composer .btn-mic, .composer .btn-primary {
    border-radius: 50%;
    width: 44px;
    height: 44px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Entry Items with Edge Lighting */
  .entry-item {
    background: var(--surface);
    color: var(--surface-text);
    border: 1px solid var(--glow-border);
    border-radius: 12px;
    padding: 16px 18px;
    margin: 0 0 12px;
    box-shadow: var(--glow-edge-highlight), var(--glow-box-shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .entry-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--glow-edge-highlight), var(--glow-hover-shadow);
  }
  .entry-item .entry-text { font-weight: 500; }
  .entry-item .entry-reply { color: var(--surface-text-muted); font-size: 0.88rem; margin-top: 6px; }
  .entry-actions { margin-top: 10px; display: flex; gap: 8px; }
  .entry-actions button { padding: 6px 12px; font-size: 0.78rem; border-color: rgba(255,255,255,0.15); color: var(--surface-text); }
  .entry-actions button:hover { background: rgba(207,159,69,0.15); }
  .entry-item textarea { color: var(--surface-text); background: var(--surface); border-color: rgba(255,255,255,0.15); }

  .entry-filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .entry-filters input { flex: 1; min-width: 140px; }
  .entry-filters select {
    font-family: 'Inter', sans-serif;
    padding: 10px 12px;
    border-radius: 7px;
    border: 1px solid var(--border-soft-2);
    background: var(--field-bg);
    color: var(--text-main);
  }

  .export-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .export-row button { font-size: 0.78rem; padding: 6px 12px; }

  .mood-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .mood-bar-label { width: 90px; flex-shrink: 0; font-size: 0.85rem; }
  .mood-bar-track {
    flex: 1;
    height: 14px;
    background: rgba(0,0,0,0.06);
    border-radius: 7px;
    overflow: hidden;
  }
  .mood-bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 7px;
    transition: width 0.4s ease;
  }
  .mood-bar-count { width: 24px; text-align: right; font-size: 0.8rem; color: var(--text-dark-muted); flex-shrink: 0; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      color: #000;
      background: #fff;
    }
    #print-area h2 { font-family: 'Fraunces', serif; }
    #print-area .print-entry { margin-bottom: 18px; page-break-inside: avoid; }
    #print-area .print-date { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
  }
  #print-area { display: none; }
  .persona-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .persona-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--gold-soft);
    letter-spacing: 0.08em;
  }
  .persona-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .persona-pill {
    padding: 5px 12px;
    font-size: 0.78rem;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border-soft-2);
    color: var(--text-muted);
    transition: all 0.2s ease;
  }
  .persona-pill:hover {
    border-color: var(--gold-soft);
    color: var(--text-main);
  }
  .persona-pill.active {
    background: var(--hover-tint);
    border-color: var(--gold);
    color: var(--gold-soft);
    box-shadow: 0 0 10px rgba(207, 159, 69, 0.25);
  }
  .attach-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7d6e5a;
  transition: background-color 0.2s;
}
.attach-btn:hover {
  background-color: rgba(0, 0, 0, 0.06);
}
.attach-menu {
  display: none;
  position: absolute;
  bottom: calc(100% + 14px);
  left: 0;
  background: #ffffff;
  border-radius: 16px;
  padding: 8px;
  min-width: 210px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
  border: 1px solid rgba(0, 0, 0, 0.08);
  z-index: 9999;
}
.attach-menu.show {
  display: block;
}
.attach-menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  color: #2b2621;
  cursor: pointer;
  transition: background-color 0.15s;
}
.attach-menu-item:hover {
  background-color: #f7f4ee;
}
.attach-menu-item svg {
  color: #5c544b;
}
</style>
</head>
<body>
<div class="page">

  <div id="signed-out">
    <div class="masthead">
      <div>
        <span class="eyebrow">Private &amp; reflective</span>
        <h1>Gemini Journal</h1>
      </div>
      <button class="btn-theme" onclick="toggleTheme()" id="theme-toggle-out" title="Toggle theme">🌙</button>
    </div>

    <div class="auth-card">
      <h3>Sign up</h3>
      <div class="field-row">
        <input type="email" id="signup-email" placeholder="Email">
                <input type="text" id="signup-name" placeholder="Your name">
        <input type="password" id="signup-password" placeholder="Password">
      </div>
      <button class="btn-primary" onclick="signUp()">Create account</button>
    </div>

    <div class="auth-card">
      <h3>Log in</h3>
      <div class="field-row">
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
      </div>
      <button class="btn-primary" onclick="logIn()">Log in</button>
      <div style="margin-top:10px;">
        <button class="btn-link" onclick="resetPassword()">Forgot password?</button>
      </div>
    </div>
  </div>

  <div id="signed-in" style="display:none;">
    <div class="masthead">
      <div>
        <span class="eyebrow">Private &amp; reflective</span>
        <h1>Gemini Journal</h1>
      </div>
      <div class="user-strip">
        <span id="streak-badge" class="streak-badge" style="display:none;"></span>
        <span id="user-email"></span>
        <button class="btn-theme" onclick="toggleTheme()" id="theme-toggle-in" title="Toggle theme">🌙</button>
        <button onclick="logOut()">Log out</button>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-primary" onclick="getInsights()">✨ Get reflection insights</button>
      <button onclick="toggleEntries()">📔 My entries</button>
      <button onclick="toggleMoodTrend()">📊 Mood trends</button>
      <button onclick="generateDailyPrompt()">💡 Inspire me</button>
    </div>

    <div class="persona-container">
      <span class="persona-label">Persona:</span>
      <div class="persona-pills">
        <button class="persona-pill active" onclick="setPersona('empathetic', this)">🌿 Empathetic</button>
        <button class="persona-pill" onclick="setPersona('socratic', this)">🧭 Socratic Coach</button>
        <button class="persona-pill" onclick="setPersona('stoic', this)">🏛️ Stoic</button>
        <button class="persona-pill" onclick="setPersona('action', this)">⚡ Action Planner</button>
      </div>
    </div>

    <div id="insights-panel" class="panel" style="display:none;"></div>
    <div id="mood-trend-panel" class="panel" style="display:none;"></div>
    <div id="entries-panel" style="display:none;">
      <div class="entry-filters">
        <input type="text" id="entry-search" placeholder="Search entries…" oninput="renderFilteredEntries()">
        <select id="mood-filter" onchange="renderFilteredEntries()">
          <option value="">All moods</option>
          <option value="happy">😊 Happy</option>
          <option value="sad">😢 Sad</option>
          <option value="anxious">😰 Anxious</option>
          <option value="angry">😠 Angry</option>
          <option value="excited">🤩 Excited</option>
          <option value="calm">😌 Calm</option>
          <option value="neutral">😐 Neutral</option>
          <option value="grateful">🙏 Grateful</option>
          <option value="tired">😴 Tired</option>
          <option value="hopeful">🌱 Hopeful</option>
        </select>
      </div>
      <div class="export-row">
        <button onclick="exportAsText()">⬇️ Export as text</button>
        <button onclick="exportAsPDF()">🖨️ Export as PDF</button>
      </div>
      <div id="entries-list"></div>
    </div>
        <h2 id="greeting-heading" style="font-family:'Fraunces',serif; font-weight:500; font-size:1.6rem; text-align:center; margin: 10px 0 24px;"></h2>
    <div id="chat-log"></div>
    <div class="composer">
      <!-- Attachment Menu Wrapper -->
      <div class="attach-container" style="position: relative; display: inline-flex; align-items: center; margin-right: 6px;">
        <button id="attachBtn" type="button" class="attach-btn" title="Attach file" onclick="toggleAttachMenu(event)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    function formatMarkdown(text) {
    return text
      .replace(/\n/g, '<br>')
      .replace(/### (.*?)(<br>|$)/g, '<br><strong>$1</strong><br>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^\* (.*)$/gm, '• $1')
      .replace(/^- (.*)$/gm, '• $1');
  }
    function stripForSpeech(text) {
    return text
      .replace(/#{1,6}\s?/g, '')
      .replace(/\*\*/g, '')
      .replace(/\*/g, '')
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
      .trim();
  }

    async function showEmptyStateIfNeeded() {

let currentPersona = 'empathetic';

function setPersona(persona, btn) {

  async function sendEntry() {
    const input = document.getElementById('entry-input');
    const message = input.value;
    if (!message && !currentAttachment) return;

    const chatLog = document.getElementById('chat-log');
    chatLog.innerHTML += `<div class="user-msg"><b>You</b>${message}</div>`;
    input.value = '';
    
    const attachmentToSend = currentAttachment;
    currentAttachment = null;
    const fileElem = document.getElementById('journalFileInput');
    if (fileElem) fileElem.value = '';
        chatLog.innerHTML += `<div class="ai-msg" id="typing-indicator"><b>Gemini</b><em>typing…</em></div>`;

    try {
      const user = auth.currentUser;
      const idToken = await user.getIdToken();

      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + idToken
        },
        body: JSON.stringify({ 
        message: message, 
        persona: currentPersona,
        attachment: attachmentToSend
      })
    });

      const data = await response.json();
            const typingEl = document.getElementById('typing-indicator');
      if (typingEl) typingEl.remove();
      if (data.reply) {
                const formattedReply = formatMarkdown(data.reply);
        const emoji = moodEmojis[data.mood] || '';
        entryCounter++;
        const replyId = `reply-${entryCounter}`;
                window[`__text_${replyId}`] = stripForSpeech(data.reply);
              chatLog.innerHTML += `<div class="ai-msg"><b>Gemini</b>${formattedReply} <span class="mood-seal" title="${data.mood}">${emoji}</span> <button class="speak-btn" id="btn-${replyId}" onclick="speakReply('${replyId}')" title="Read aloud">🔊</button></div>`;
      } else {
        chatLog.innerHTML += `<div class="ai-msg" style="color:#b5654f;">Error: ${data.error}</div>`;
      }
        } catch (err) {
      const typingEl = document.getElementById('typing-indicator');
      if (typingEl) typingEl.remove();
      chatLog.innerHTML += `<div class="ai-msg" style="color:#b5654f;">Error: ${err.message}</div>`;
    }
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function speakReply(replyId) {
    if (!('speechSynthesis' in window)) {
      alert('Text-to-speech is not supported in this browser.');
      return;
    }
    const text = window[`__text_${replyId}`];
    const btn = document.getElementById(`btn-${replyId}`);

    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();
      document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
      if (btn && btn.dataset.wasActive === 'true') {
        btn.dataset.wasActive = 'false';
        return;
      }
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    utterance.onstart = () => { if (btn) { btn.classList.add('speaking'); btn.dataset.wasActive = 'true'; } };
    utterance.onend = () => { if (btn) { btn.classList.remove('speaking'); btn.dataset.wasActive = 'false'; } };
    speechSynthesis.speak(utterance);
  }

  async function getInsights() {
    const panel = document.getElementById('insights-panel');
    panel.style.display = 'block';
    panel.innerHTML = 'Thinking…';

    try {
      const user = auth.currentUser;
      const idToken = await user.getIdToken();

      const response = await fetch('/api/insights', {
        method: 'GET',
        headers: { 'Authorization': 'Bearer ' + idToken }
      });

      const data = await response.json();
      if (data.insight) {
                panel.innerHTML = '<b>Your reflection</b><br><br>' + formatMarkdown(data.insight);
      } else {
        panel.innerHTML = 'Error: ' + data.error;

      panel.innerHTML = 'Error: ' + err.message;
    }

  let moodTrendVisible = false;
  async function toggleMoodTrend() {
    const panel = document.getElementById('mood-trend-panel');
    moodTrendVisible = !moodTrendVisible;
    if (!moodTrendVisible) {
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';
    panel.innerHTML = 'Loading…';

    try {
      const user = auth.currentUser;
      const idToken = await user.getIdToken();
      const response = await fetch('/api/mood-trend', {
        method: 'GET',
        headers: { 'Authorization': 'Bearer ' + idToken }
      });
      const data = await response.json();

      if (!data.mood_counts || Object.keys(data.mood_counts).length === 0) {
        panel.innerHTML = '<b>Mood trends</b><br><br>No entries yet — write a few to see your mood patterns.';
        return;
      }

      const maxCount = Math.max(...Object.values(data.mood_counts));
      let html = '<b>Mood trends</b><br><br>';
      Object.entries(data.mood_counts)
        .sort((a, b) => b[1] - a[1])
        .forEach(([mood, count]) => {
          const emoji = moodEmojis[mood] || '';
          const pct = (count / maxCount) * 100;
          html += `
            <div class="mood-bar-row">
              <div class="mood-bar-label">${emoji} ${mood}</div>
              <div class="mood-bar-track"><div class="mood-bar-fill" style="width:${pct}%;"></div></div>
              <div class="mood-bar-count">${count}</div>
            </div>
          `;
        });
      panel.innerHTML = html;
    } catch (err) {
      panel.innerHTML = 'Error: ' + err.message;
    }
  }

  let entriesVisible = false;
  let allEntries = [];

  async function toggleEntries() {
    const panel = document.getElementById('entries-panel');
    entriesVisible = !entriesVisible;
    if (!entriesVisible) {
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';
    await loadEntries();
  }

  async function loadEntries() {
    const listDiv = document.getElementById('entries-list');
    listDiv.innerHTML = 'Loading…';
    try {
      const user = auth.currentUser;
      const idToken = await user.getIdToken();
      const response = await fetch('/api/entries', {
        method: 'GET',
        headers: { 'Authorization': 'Bearer ' + idToken }
      });
      const data = await response.json();
      allEntries = data.entries || [];
      renderFilteredEntries();
    } catch (err) {
      listDiv.innerHTML = 'Error: ' + err.message;
    }
  }

  function renderFilteredEntries() {
    const listDiv = document.getElementById('entries-list');
    const searchTerm = document.getElementById('entry-search').value.toLowerCase();
    const moodTerm = document.getElementById('mood-filter').value;

    const filtered = allEntries.filter(entry => {
      const matchesSearch = !searchTerm || entry.user_message.toLowerCase().includes(searchTerm);
      const matchesMood = !moodTerm || entry.mood === moodTerm;
      return matchesSearch && matchesMood;
    });

    if (filtered.length === 0) {
      listDiv.innerHTML = '<div class="panel">No matching entries.</div>';
      return;
    }

    listDiv.innerHTML = '';
    filtered.forEach(entry => {
      const emoji = moodEmojis[entry.mood] || '';
      const div = document.createElement('div');
      div.className = 'entry-item';
      div.innerHTML = `
        <div><span class="mood-seal" title="${entry.mood}">${emoji}</span> <span class="entry-text">${entry.user_message}</span></div>
        <div class="entry-reply">${entry.ai_reply}</div>
        <div class="entry-actions">
          <button onclick="startEdit('${entry.id}', this)">Edit</button>
          <button class="btn-ghost-danger" onclick="deleteEntry('${entry.id}')">Delete</button>
        </div>
      `;
      listDiv.appendChild(div);
    });
  }

  function getCurrentlyFilteredEntries() {
    const searchTerm = document.getElementById('entry-search').value.toLowerCase();
    const moodTerm = document.getElementById('mood-filter').value;
    return allEntries.filter(entry => {
      const matchesSearch = !searchTerm || entry.user_message.toLowerCase().includes(searchTerm);
      const matchesMood = !moodTerm || entry.mood === moodTerm;
      return matchesSearch && matchesMood;
    });
  }

  function exportAsText() {
    const entries = getCurrentlyFilteredEntries();
    if (entries.length === 0) {
      alert('No entries to export.');
      return;
    }
    let text = 'GEMINI JOURNAL — EXPORTED ENTRIES\n';
    text += '='.repeat(40) + '\n\n';
    entries.forEach((entry, i) => {
      text += `Entry ${i + 1}  [Mood: ${entry.mood}]\n`;
      text += `You: ${entry.user_message}\n`;
      text += `Gemini: ${entry.ai_reply}\n`;
      text += '-'.repeat(40) + '\n\n';
    });

    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gemini-journal-entries.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportAsPDF() {
    const entries = getCurrentlyFilteredEntries();
    if (entries.length === 0) {
      alert('No entries to export.');
      return;
    }
    const printArea = document.getElementById('print-area');
    let html = '<h2>Gemini Journal — Exported Entries</h2>';
    entries.forEach((entry, i) => {
      const emoji = moodEmojis[entry.mood] || '';
      html += `
        <div class="print-entry">
          <div class="print-date">Entry ${i + 1} · ${emoji} ${entry.mood}</div>
          <p><strong>You:</strong> ${entry.user_message}</p>
          <p><strong>Gemini:</strong> ${entry.ai_reply}</p>
        </div>
      `;
    });
    printArea.innerHTML = html;
    window.print();
  }

  function startEdit(entryId, btn) {
    const entryDiv = btn.closest('.entry-item');
    const textSpan = entryDiv.querySelector('.entry-text');
    const currentText = textSpan.textContent;
    const actionsDiv = entryDiv.querySelector('.entry-actions');

    entryDiv.querySelector('div').innerHTML = `<textarea id="edit-${entryId}" rows="2">${currentText}</textarea>`;
    actionsDiv.innerHTML = `
      <button onclick="saveEdit('${entryId}')">Save</button>
      <button onclick="loadEntries()">Cancel</button>
    `;
  }

  async function saveEdit(entryId) {
    const newText = document.getElementById(`edit-${entryId}`).value;
    try {
      const user = auth.currentUser;
      const idToken = await user.getIdToken();
      const response = await fetch(`/api/entries/${entryId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + idToken
        },
        body: JSON.stringify({ user_message: newText })
      });
      const data = await response.json();
      if (data.success) {
        await loadEntries();
      } else {
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  async function deleteEntry(entryId) {
    if (!confirm('Delete this entry?')) return;
    try {
      const user = auth.currentUser;
      const idToken = await user.getIdToken();
      const response = await fetch(`/api/entries/${entryId}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + idToken }
      });
      const data = await response.json();
      if (data.success) {
        await loadEntries();
      } else {
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  // Voice-to-text
  let recognition = null;
  let isRecording = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    document.addEventListener('DOMContentLoaded', () => {
      const micBtn = document.getElementById('mic-btn');
      if (micBtn) micBtn.style.display = 'flex';
    });

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    let baseText = '';

    recognition.onstart = () => {
      isRecording = true;
      baseText = document.getElementById('entry-input').value;
      const micBtn = document.getElementById('mic-btn');
      micBtn.classList.add('recording');
    };

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      const input = document.getElementById('entry-input');
      input.value = (baseText ? baseText + ' ' : '') + transcript;
    };

    recognition.onerror = (event) => {
      console.error('Speech recognition error:', event.error);
      stopRecording();
    };

    recognition.onend = () => {
      stopRecording();
    };
  } else {
    document.addEventListener('DOMContentLoaded', () => {
      const micBtn = document.getElementById('mic-btn');
      if (micBtn) micBtn.style.display = 'none';
    });
  }

  function stopRecording() {
    isRecording = false;
    const micBtn = document.getElementById('mic-btn');
    if (micBtn) micBtn.classList.remove('recording');
  }

  function toggleVoiceInput() {
    if (!recognition) return;
    if (isRecording) {
      recognition.stop();
    } else {
      recognition.start();
    }
  }
  function toggleAttachMenu(event) {
  event.stopPropagation();
  const menu = document.getElementById('attachMenu');
  if (menu) menu.classList.toggle('show');
}

document.addEventListener('click', (e) => {
  const menu = document.getElementById('attachMenu');
  const attachBtn = document.getElementById('attachBtn');
  if (menu && !menu.contains(e.target) && (!attachBtn || !attachBtn.contains(e.target))) {
    menu.classList.remove('show');
  }
});

function triggerFileUpload() {
  const menu = document.getElementById('attachMenu');
  if (menu) menu.classList.remove('show');
  document.getElementById('journalFileInput').click();
}

let currentAttachment = null;

function handleFileSelected(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const base64Data = e.target.result.split(',')[1];
    currentAttachment = {
      filename: file.name,
      mimeType: file.type || 'image/jpeg',
      data: base64Data
    };

    const input = document.getElementById('entry-input');
    if (input) {
      input.value = `[Attached: ${file.name}] ` + input.value;
      input.focus();
    }
  };
  reader.readAsDataURL(file);
}
